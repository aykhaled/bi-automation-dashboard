name: Weekly Report

on:
  schedule:
    # 07:00 UTC every Monday. GitHub runs scheduled jobs on a best-effort
    # basis and may delay them under load; this is not a hard guarantee.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify pipeline artifacts are present
        run: |
          for f in daily_series.parquet sales.parquet returns.parquet \
                   anomalies.parquet churn_scores.parquet model_metrics.json; do
            if [ ! -f "data/processed/$f" ]; then
              echo "::error::Missing artifact data/processed/$f"
              exit 1
            fi
          done
          echo "All required artifacts present."

      - name: Generate weekly report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m src.pipeline --stage report

      - name: Fail if narrative was not model-generated
        run: |
          GROUNDED=$(python -c "import json;print(json.load(open('reports/latest_narrative.json'))['grounded'])")
          if [ "$GROUNDED" != "True" ]; then
            echo "::error::Narrative fell back to deterministic mode — check OPENAI_API_KEY."
            python -c "import json;print(json.load(open('reports/latest_narrative.json')).get('note',''))"
            exit 1
          fi
          echo "Narrative generated by the configured model."

      - name: Summarise run
        run: |
          python - <<'EOF'
          import json, os
          n = json.load(open("reports/latest_narrative.json"))
          m = json.load(open("reports/latest_metrics.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "w") as f:
              f.write(f"## Weekly report — {m['period']['start']} to {m['period']['end']}\n\n")
              f.write(f"**Model:** {n['model']}  \n")
              f.write(f"**Words:** {len(n['text'].split())}\n\n")
              f.write(f"> {n['text']}\n")
          EOF

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: |
            reports/*.html
            reports/latest_metrics.json
          retention-days: 90