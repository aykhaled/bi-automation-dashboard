source:
  path: data/raw/online_retail_II.csv
  type: csv

columns:
  transaction_id: Invoice
  date: InvoiceDate
  customer_id: Customer ID
  product_id: StockCode
  product_name: Description
  quantity: Quantity
  unit_price: Price
  region: Country

business_rules:
  currency: GBP
  cancellation_prefix: "C"
  churn_window_days: 90
  min_order_value: 0
  drop_missing_customer: false
  product_code_pattern: "^\\d{5}"   # real SKUs start with 5 digits
  drop_exact_duplicates: true

report:
  frequency: weekly
  recipient_role: "Head of E-commerce"
  tone: concise executive
  model: gpt-4o-mini
  max_words: 200
  comparison_days: 7
  top_movers: 5
  output_dir: reports

modeling:
  lookback_days: 365          # customer must have purchased within this window to be scored
  snapshot_spacing_days: 30   # gap between training snapshots
  n_train_snapshots: 10
  min_history_days: 180       # snapshot needs at least this much prior data
  at_risk_decile: 0.10
  max_iter: 250
  learning_rate: 0.06
  random_state: 42

anomaly:
  window_days: 28
  z_threshold: 2.5
  min_periods: 14
